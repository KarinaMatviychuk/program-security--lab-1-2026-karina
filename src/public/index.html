<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookTrace — Трекер прочитаного</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .auth-box, .app-box { display: none; }
        .active { display: block; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2980b9; }
        .book-card { background: #f8f9fa; border-left: 4px solid #3498db; padding: 15px; margin: 15px 0; border-radius: 6px; }
        .progress-bar { background: #e0e0e0; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0; }
        .progress-fill { background: #2ecc71; height: 100%; width: 0%; transition: 0.3s; }
        .alert { padding: 10px; border-radius: 6px; margin: 10px 0; display: none; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 BookTrace — Трекер прочитаного</h1>
    <div id="alertBox" class="alert"></div>

    <!-- ВІКНО ВХОДУ / РЕЄСТРАЦІЇ -->
    <div id="authSection" class="auth-box active">
        <h2>Автентифікація в системі</h2>
        <input type="email" id="email" placeholder="Email (наприклад: karina@gmail.com)">
        <input type="password" id="password" placeholder="Пароль (мін. 8 символів)">
        <input type="text" id="mfaToken" placeholder="6-значний код МФА (якщо увімкнено)">
        <button onclick="login()">Увійти</button>
        <button onclick="register()" style="background: #2ecc71;">Зареєструватися</button>
    </div>

    <!-- ГОЛОВНИЙ ИНТЕРФЕЙС ТРЕКЕРА (ПІСЛЯ ВХОДУ) -->
    <div id="appSection" class="app-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <p>Вітаємо, <b id="userEmail"></b> (<span id="userRole"></span>)</p>
            <button onclick="logout()" style="width: auto; background: #e74c3c;">Вийти</button>
        </div>

        <hr>

        <h2>➕ Додати нову книгу</h2>
        <input type="text" id="bookTitle" placeholder="Назва книги">
        <input type="text" id="bookAuthor" placeholder="Автор">
        <input type="number" id="bookPages" placeholder="Загальна кількість сторінок">
        <button onclick="addBook()">Зберегти книгу в трекер</button>

        <h2>📖 Мої книги та прогрес</h2>
        <div id="booksList"></div>
    </div>
</div>

<script>
    async function apiRequest(url, method, data) {
        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: data ? JSON.stringify(data) : null
        });
        const result = await res.json();
        if (!res.ok) {
            showAlert(result.error || 'Помилка виконання', 'error');
            return null;
        }
        return result;
    }

    function showAlert(msg, type) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (type === 'error' ? 'alert-error' : 'alert-success');
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 4000);
    }

    async function register() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const res = await apiRequest('/api/auth/register', 'POST', { email, password, role: 'READER' });
        if (res) {
            showAlert(res.message + ' Ваш МФА секрет: ' + res.mfaSecret, 'success');
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const mfaToken = document.getElementById('mfaToken').value;

        const res = await apiRequest('/api/auth/login', 'POST', { email, password, mfaToken });
        if (res) {
            showAlert('Успішний вхід!', 'success');
            document.getElementById('authSection').classList.remove('active');
            document.getElementById('appSection').classList.add('active');
            document.getElementById('userEmail').innerText = res.user.email;
            document.getElementById('userRole').innerText = res.user.role;
            loadBooks();
        }
    }

    async function logout() {
        await apiRequest('/api/auth/logout', 'POST');
        document.getElementById('appSection').classList.remove('active');
        document.getElementById('authSection').classList.add('active');
    }

    async function loadBooks() {
        const res = await apiRequest('/api/books', 'GET');
        if (!res) return;

        const list = document.getElementById('booksList');
        list.innerHTML = '';

        if (res.books.length === 0) {
            list.innerHTML = '<p>У вас поки немає доданих книг.</p>';
            return;
        }

        res.books.forEach(book => {
            const percent = Math.round((book.readPages / book.totalPages) * 100) || 0;
            list.innerHTML += `
                <div class="book-card">
                    <h3>${book.title} — <i>${book.author}</i></h3>
                    <p>Прогрес: <b>${book.readPages}</b> з <b>${book.totalPages}</b> сторінок (${percent}%)</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%;"></div>
                    </div>
                    <input type="number" id="progress-${book.id}" placeholder="Прочитано сторінок">
                    <input type="text" id="note-${book.id}" placeholder="Нотатка / Цитата">
                    <button onclick="updateProgress('${book.id}')">Оновити прогрес</button>
                </div>
            `;
        });
    }

    async function addBook() {
        const title = document.getElementById('bookTitle').value;
        const author = document.getElementById('bookAuthor').value;
        const totalPages = document.getElementById('bookPages').value;

        const res = await apiRequest('/api/books', 'POST', { title, author, totalPages });
        if (res) {
            showAlert('Книгу додано!', 'success');
            loadBooks();
        }
    }

    async function updateProgress(bookId) {
        const readPages = document.getElementById(`progress-${bookId}`).value;
        const note = document.getElementById(`note-${bookId}`).value;

        const res = await apiRequest(`/api/books/${bookId}/progress`, 'PUT', { readPages, note });
        if (res) {
            showAlert('Прогрес оновлено!', 'success');
            loadBooks();
        }
    }
</script>

</body>
</html>
